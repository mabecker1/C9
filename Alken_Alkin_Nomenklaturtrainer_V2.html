/* Ergänzungen ausschließlich für die Fachfunktionen der Alkene und Alkine;
   alle gemeinsamen Layout- und Gestaltungseigenschaften stammen unverändert aus Alkan V3. */
.bond{fill:none}
.bond.selected{stroke:#1aa8c0;stroke-width:5.8}
.bond.target{stroke:var(--orange);stroke-width:6}
.bond.branch{stroke:var(--purple);stroke-width:5}
.bond.muted{stroke:#becbd7;stroke-width:3.1}
.atom-hit{fill:transparent;cursor:default}
