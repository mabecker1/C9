  if(targetNums!==gotNums)return ['Seitenketten zählen',`Du hast die Arten der Seitenketten erkannt, aber noch nicht alle Vorkommen erfasst. Vergiss doppelte Verzweigungen an einem C-Atom nicht.`];
  let positions=p.parts.flatMap(x=>x.locs).sort((a,b)=>a-b),expected=model.best.locs;
  let reversed=positions.map(x=>model.best.path.length+1-x).sort((a,b)=>a-b);
  if(locCompare(reversed,expected)===0)return ['Nummerierung umkehren','Du hast wahrscheinlich vom anderen Ende aus gezählt. Vergleiche die geordneten Listen aller Seitenkettenpositionen von beiden Enden. Die erste unterschiedliche Zahl entscheidet.'];
  if(locCompare(positions,expected)!==0)return ['Positionszahlen prüfen','Die Arten und Anzahlen der Seitenketten wirken passend. Prüfe die Verknüpfungspunkte und wähle die Nummerierung mit der kleinsten Positionszahlenfolge.'];
  if(providedGroup.map(x=>x.name).join('|')!==providedGroup.map(x=>x.name).sort().join('|'))return ['Alphabetisch sortieren','Ethyl wird vor Methyl genannt; „di“, „tri“ und „tetra“ werden bei der Reihenfolge nicht mitgezählt.'];
 }
 if(/methyl/.test(v)&&!v.includes('di')&&expectedGroup.some(x=>x.len===1&&x.locs.length>1))return ['Mehrere Methylgruppen?','Achte darauf, ob Methylgruppen mehrfach vorkommen. Bei zwei gleichen Gruppen brauchst du „di“ und zwei Positionszahlen.'];
 return ['Struktur und Name abgleichen','Mindestens eine Seitenkette, Positionszahl oder ihre Zuordnung stimmt noch nicht. Markiere im Baukasten zuerst die Hauptkette und zähle die abzweigenden C-Atome.'];

function explainRingWrong(input,model){
 const v=norm(input),answer=model.best.name,p=parseName(input);
 if(!v)return ['Noch kein Name','Gib zunächst einen Namen ein oder nutze die Hilfe.'];
 if(loose(input)===loose(answer))return ['Zeichensetzung prüfen','Trenne unterschiedliche Seitenketten durch Bindestriche und ihre Positionszahlen mit Kommata.'];
 if(p.error==='root'||!p.cyclic)return ['Ring als Stammstruktur','Ein Cycloalkan erkennt man am geschlossenen Kohlenstoffring. Überprüfe den Stammnamen mit „cyclo“.'];
 if(p.error==='count')return ['Mehrfachvorsätze und Lokanten','Zu „di“ gehören zwei Positionszahlen, zu „tri“ drei. Bei nur einer Seitenkette am Ring entfällt die Positionszahl 1.'];
 if(p.error==='positions')return ['Positionen am Ring','Bei der Ringnummerierung sind nur Zahlen von 1 bis zur Anzahl der Ring-C-Atome möglich.'];
 if(p.error==='valence')return ['Vierbindigkeit','Am Ring hat jedes Kohlenstoffatom bereits zwei Ringbindungen. Es können höchstens zwei weitere C–C-Bindungen dazukommen.'];
 if(p.error==='prefix')return ['Schreibweise der Seitenketten','Bei mehreren Seitenketten beginnen die Positionszahlen mit 1. Achte auf alphabetische Reihenfolge und Zahlvorsätze.'];
 if(graphSignature(p.mol)===graphSignature(model)){
  if(model.best.branches.length===1&&/^1-/.test(v))return ['Positionszahl überflüssig','Bei einem Cycloalkan mit genau einer Seitenkette ist die Position eindeutig. Die 1 wird weggelassen.'];
  let target=model.best.locs,actual=p.parts.flatMap(x=>x.locs).sort((a,b)=>a-b);
  if(locCompare(actual,target)!==0)return ['Ring anders nummerieren','Die Struktur passt, aber du kannst den Startpunkt oder die Zählrichtung so ändern, dass die erste abweichende Positionszahl kleiner wird.'];
  return ['Alphabetische Reihenfolge','Bei gleicher Positionszahlenfolge bekommt die alphabetisch zuerst genannte Seitenkette die kleinste Position. „Di“ und „tri“ werden nicht berücksichtigt.'];
 }
 if(ROOTS.indexOf(p.root)!==model.ring.length)return ['Ringgröße prüfen','Zähle die C-Atome im geschlossenen Ring; nicht die gesamte Anzahl der C-Atome.'];
 return ['Seitenketten und Positionen','Prüfe die Länge der Seitenketten und die Positionen am Ring. Der richtige Startpunkt wird noch nicht angezeigt.'];
}
function newRound(level=S.level){
 S.level=level;S.index=0;S.score=0;$('#tube').classList.remove('celebrate');
 const unique=(specs,count)=>{
  const selected=[],seen=new Set();
  for(const spec of shuffle(specs)){
   const mol=makeMol(spec);if(mol.adj.some(a=>a.length>4))continue;
   const opt=chooseOpts(mol).best;
   if(opt.path.length<4||opt.branches.some(b=>!b.straight||b.len>3)||seen.has(opt.name))continue;
   seen.add(opt.name);selected.push(mol);if(selected.length===count)break;
  }
  return selected;
 };
 const pool=POOLS[level];
 const ringCount=level==='easy'?0:7;
 const chains=unique(pool.filter(p=>p[0]!=='ring'),ROUND_SIZE-ringCount);
 const rings=ringCount?unique(pool.filter(p=>p[0]==='ring'),ringCount):[];
 S.tasks=shuffle([...chains,...rings]);
 if(S.tasks.length!==ROUND_SIZE)throw Error('Zu wenige verschiedene Aufgaben in '+level+': '+S.tasks.length);
 $('#complete').classList.remove('show');
 document.querySelectorAll('#difficulty button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.level===level));renderScore();showTask();
}

function showTask(){
 S.current=S.tasks[S.index];const choice=chooseOpts(S.current);S.best=choice.peers;S.solution=choice.best;S.current.best=choice.best;
 if(!S.current.cyclic){
  const alt=choice.all.filter(o=>o.path.length===choice.best.path.length-1&&o.path.length>=4&&o.branches.every(b=>b.straight&&b.len<=3));
  const trap=S.level==='hard'?S.index%3!==0:S.level==='medium'?S.index%2===1:S.index===6;
  S.current.displayPath=trap&&alt.length?(shuffle(alt).find(o=>safeDrawPath(S.current,o.path))?.path||S.current.spine):S.current.spine;
 }
 S.solved=false;S.hints=false;S.stage=0;S.selected=[];S.path=null;S.dir=0;S.branches=[];S.found=new Set();S.activeBranch=null;S.buildRows=[];S.buildRoot='';S.ringStart=0;S.ringClockwise=true;
 $('#taskNo').textContent=`AUFGABE ${S.index+1} / ${ROUND_SIZE}`;$('#levelTag').textContent={easy:'EINFACH',medium:'MITTEL',hard:'KNIFFLIG'}[S.level];
 $('#answer').value='';$('#answer').disabled=false;$('#verify').disabled=false;
 $('#afterCorrect').hidden=true;$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#hintbody').classList.remove('open');
 $('#helpToggle').textContent='Hilfe öffnen';$('#helpToggle').setAttribute('aria-expanded','false');$('#microfeedback').textContent='';
 renderHelp();drawMol();
}

 $('#segbar').innerHTML=Array.from({length:ROUND_SIZE},(_,i)=>`<span class="${i<S.score?'full':''}"></span>`).join('');

function showFeedback(title,msg,type='bad'){$('#feedback').className=`feedback show ${type}`;$('#feedback').innerHTML=`<strong>${escapeHtml(title)}</strong>${escapeHtml(msg)}`}
function hasCapitalInitial(raw){const m=raw.match(/[A-Za-zÄÖÜäöü]/);return !!m&&m[0]===m[0].toUpperCase();}
function verify(){
 if(S.solved)return;
 const raw=$('#answer').value.trim(),v=norm(raw);if(v===norm(S.solution.name)&&!hasCapitalInitial(raw)){showFeedback('Großschreibung beachten','Der erste Buchstabe des IUPAC-Namens muss großgeschrieben werden (z. B. 3-Ethyl-2-methylhexan).');return;}if(v===norm(S.solution.name)){

  setTimeout(()=>{if(S.score!==ROUND_SIZE||!S.solved)return;$('#tube').classList.add('celebrate');fireworks()},700);
  setTimeout(()=>{if(S.score===ROUND_SIZE&&S.solved)$('#complete').classList.add('show')},2200);

}

function setMicro(text,positive=false){$('#microfeedback').style.color=positive?'#188262':'#96652d';$('#microfeedback').textContent=text;}
function isAdjacent(a,b){return S.current.adj[a].includes(b)}
function samePath(a,b){return a.length===b.length&&a.every((x,i)=>b[i]===x)}
function currentTarget(){return S.best.find(o=>samePath(S.path,o.path)||samePath(S.path,o.path.slice().reverse()))||S.solution}
function chooseAtom(v){
 if(!S.hints||S.solved)return;
 if(S.stage===0){
  if(S.selected.length===0){S.selected=[v];setMicro('Kette begonnen. Klicke auf ein benachbartes C-Atom.');}
  else if(S.selected[S.selected.length-1]===v){S.selected.pop();setMicro('Letztes C-Atom entfernt.');}
  else if(S.selected.includes(v)){S.selected=S.selected.slice(0,S.selected.indexOf(v)+1);setMicro('Kette bis hierhin verkürzt.');}
  else if(isAdjacent(S.selected[S.selected.length-1],v)){S.selected.push(v);setMicro(`${S.selected.length} C-Atome ausgewählt. Ist das die längste mögliche Kette?`)}
  else{setMicro('Nur direkt verbundene C-Atome lassen sich zu einer durchgehenden Hauptkette verbinden.');}
  renderHelp();drawMol();
 }else if(S.stage===2){
  const group=S.branches.findIndex(b=>b.nodes.includes(v));if(group<0){setMicro('Klicke auf ein C-Atom außerhalb der türkis markierten Hauptkette.');return;}
  if(S.found.has(group)){setMicro('Diese Seitenkette wurde bereits richtig bestimmt. Wähle eine andere.');return;}
  S.activeBranch=group;S.groupInput='methyl';S.posInput=1;setMicro('Seitenkette markiert. Bestimme ihre Länge und die Position, an der sie an der Hauptkette hängt.');renderHelp();drawMol();
 }
}
function checkPath(){
 const selected=S.selected;
 if(S.current.cyclic){
  const ring=S.current.ring;
  if(selected.length!==ring.length||!selected.every(v=>ring.includes(v))||!isAdjacent(selected[0],selected[selected.length-1])){
   setMicro('Wähle die C-Atome des geschlossenen Rings lückenlos aus – ohne die Seitenketten.');return;
  }
  S.path=selected.slice();S.stage=1;setMicro('Ring erkannt! Lege nun selbst Startpunkt und Richtung der Nummerierung fest.',true);renderHelp();drawMol();return;
 }
 if(selected.length<2){setMicro('Wähle mindestens zwei aufeinanderfolgende C-Atome.');return}
 let longest=S.solution.path.length;
 if(selected.length<longest){setMicro(`Diese Kette umfasst ${selected.length} C-Atome, es gibt aber eine längere durchgehende Kette. Probiere einen anderen Weg.`);return}
 if(selected.length>longest){setMicro('Diese Auswahl ist keine gültige Hauptkette; kontrolliere die Verbindungen.');return}
 const valid=S.best.some(o=>samePath(selected,o.path)||samePath(selected,o.path.slice().reverse()));
 if(!valid){let a=branchData(S.current,selected).length,needed=S.solution.count;
 setMicro(a<needed?`Es gibt gleich lange Ketten. Deine Wahl lässt ${a} Seitenketten übrig; eine andere lässt mehr Seitenketten übrig.`:'Die Länge stimmt. Prüfe bei Gleichstand die Positionszahlen der Verzweigungen.');return}

function checkDirection(d){

 if(!valid){

  let list=bs.map(b=>b.loc).sort((a,b)=>a-b),rev=other.map(b=>b.loc).sort((a,b)=>a-b);
  if(locCompare(list,rev)>0)setMicro(`Versuche das andere Ende. Vergleiche ${list.join(', ')} mit ${rev.join(', ')}: die erste unterschiedliche Zahl entscheidet.`);

 }

function checkRingNumbering(){

function identifyBranch(){
