<script>

const $=q=>document.querySelector(q), NS='http://www.w3.org/2000/svg';
const ROOT=['','Meth','Eth','Prop','But','Pent','Hex','Hept','Oct','Non','Dec','Undec','Dodec'];

const shuffle=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x};

const cap=s=>String(s).replace(/[a-zäöü]/i,m=>m.toUpperCase());
const norm=s=>String(s).normalize('NFKC').trim().replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue');
const loose=s=>norm(s).replace(/[-,]/g,'');
let S={level:'easy',tasks:[],index:0,score:0,solved:false,hints:false,stage:0,selected:[],path:null,branches:[],branchIndex:0,dirChoice:0,ordered:[],multiEntries:[],multiIndex:0,locAnswers:{},countAnswers:{},ezEntries:[],ezIndex:0,ezAnswers:{},builderRoot:'',builderSuffix:'',builderOrder:[],task:null,best:null,coords:null};

function makeMol(spec){
 const {n,ds,ts,branches,ez}=spec;
 const adj=Array.from({length:n},()=>[]),edges=[];
 function add(a,b,order=1){const e={id:edges.length,a,b,order};edges.push(e);adj[a].push({v:b,e});adj[b].push({v:a,e});return e}
 for(let i=0;i<n-1;i++)add(i,i+1,ds.includes(i+1)?2:ts.includes(i+1)?3:1);
 for(const [p,len] of branches){let last=p-1;for(let k=0;k<len;k++){let next=adj.length;adj.push([]);add(last,next);last=next}}
 const stereoByEdge={};for(const [pos,config] of Object.entries(ez))stereoByEdge[Number(pos)-1]=config;
 return {spec,adj,edges,spine:Array.from({length:n},(_,i)=>i),ez:stereoByEdge,n};
}
function branchComponents(m,path){
 const inP=new Set(path),bs=[];
 for(let i=0;i<path.length;i++)for(const item of m.adj[path[i]]){
  if(inP.has(item.v))continue;
  let stack=[[item.v,path[i]]],nodes=[],straight=true;
  while(stack.length){const [u,parent]=stack.pop();nodes.push(u);if(m.adj[u].filter(x=>!inP.has(x.v)).length>2)straight=false;for(const v of m.adj[u])if(v.v!==parent&&!inP.has(v.v)){if(v.e.order!==1)straight=false;stack.push([v.v,u])}}
  bs.push({anchor:path[i],first:item.v,loc:i+1,len:nodes.length,nodes,straight});
 }

}
function pathEdges(path){return new Set(path.slice(1).map((v,i)=>sig(v,path[i])))}
function pathInfo(m,path){
 const bs=branchComponents(m,path);
 if(bs.some(b=>!b.straight||b.len>3))return null;
 const es=pathEdges(path);
 if(m.edges.some(e=>e.order>1&&!es.has(sig(e.a,e.b))))return null;
 const d=[],t=[];
 for(let i=0;i<path.length-1;i++){let edge=m.adj[path[i]].find(x=>x.v===path[i+1])?.e;if(!edge)return null;if(edge.order===2)d.push(i+1);if(edge.order===3)t.push(i+1)}
 const grouped=groupBranches(bs),locs=bs.map(x=>x.loc).sort((a,b)=>a-b);

}
function groupBranches(bs){let map=new Map();for(const b of bs){if(!map.has(b.len))map.set(b.len,[]);map.get(b.len).push(b.loc)}return [...map].map(([len,locs])=>({len,locs:locs.sort((a,b)=>a-b),name:GROUP[len],prefix:MULT[locs.length]})).sort((a,b)=>a.name.localeCompare(b.name,'de'))}
function compareInfo(a,b){return b.path.length-a.path.length||b.bs.length-a.bs.length|| (a.d.length?cmp(a.d,b.d):cmp(a.t,b.t)) ||(a.d.length?cmp(a.t,b.t):0)||cmp(a.locs,b.locs)||cmp(a.alphaLoc,b.alphaLoc)}
function enumerate(m){
 let leaves=m.adj.map((v,i)=>v.length===1?i:-1).filter(i=>i>=0),out=[];
 for(let i=0;i<leaves.length;i++)for(let j=i+1;j<leaves.length;j++){
  let start=leaves[i],end=leaves[j],stack=[[start,-1,[start]]],path=null;
  while(stack.length){let [v,parent,part]=stack.pop();if(v===end){path=part;break}for(const {v:u} of m.adj[v])if(u!==parent)stack.push([u,v,part.concat(u)])}
  if(!path)continue;for(const p of [path,[...path].reverse()]){let data=pathInfo(m,p);if(data)out.push(data)}

}
function suffix(info){
 const {d,t}=info,n=info.path.length;let base=ROOT[n].toLowerCase();base=base.charAt(0).toUpperCase()+base.slice(1);const useA=d.length>=2||t.length>=2;
 if(useA)base+='a';
 let ending='';if(d.length)ending+='-'+d.join(',')+'-'+(d.length===1?'en':MULT[d.length]+'en');

}
function nameParts(m,info){
 const g=info.grouped,sub=g.map((x,i)=>x.locs.join(',')+'-'+(i===0?cap((x.prefix||'')+x.name):(x.prefix||'')+x.name)).join('-');

function randomSpec(level,kind){

 let types=kind==='d'?['d']:kind==='t'?['t']:kind==='dd'?['d','d']:kind==='tt'?['t','t']:kind==='dt'?['d','t']:kind==='ddd'?['d','d','d']:kind==='ddt'?['d','d','t']:['d','t','t'];

 for(const type of types){let possible=places.filter(k=>!picked.some(x=>Math.abs(x.pos-k)<2));if(!possible.length)return null;let pos=possible[Math.floor(Math.random()*possible.length)];picked.push({pos,type})}

 for(let at=2;at<n;at++){

function firstNameLetterIsUpper(input){let full=String(input).trim();const descriptor=full.match(/^\(([^)]*)\)-/);if(descriptor&&/[ez]/.test(descriptor[1]))return false;let s=full.replace(/^\((?:[EZ]|(?:\d+[EZ],)*\d+[EZ])\)-/,'').replace(/^[\d,\s-]*/,'');const match=s.match(/[A-Za-zÄÖÜäöü]/);return Boolean(match&&match[0]===match[0].toUpperCase())}
function wrongFeedback(input){

 if(roots.length&&!roots.some(x=>x===ROOT[meta.path.length].toLowerCase()))return ['Stammkette prüfen','Zähle die C-Atome der längsten Kette, die sämtliche Doppel- und Dreifachbindungen enthält. Auch ein Knick kann zur Hauptkette gehören.'];

 }
